name: Test Roswell

on:
  workflow_dispatch:
    inputs:
      xemu_version:
        description: "xemu release version tag (e.g. 'latest', 'v0.8.30')"
        required: false
        default: "latest"
        type: string
      roswell_version:
        description: "Roswell release version tag (e.g. 'latest', 'v0.1.0')"
        required: false
        default: "latest"
        type: string
      install_windows_ffmpeg:
        description: "Install ffmpeg on Windows runner (slow)"
        required: false
        default: false
        type: boolean
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-data:
    name: Prepare Test Data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache Test XBE ISO
        id: cache-test-xbe
        uses: actions/cache@v6
        with:
          path: xemutest/data/TestXBE/tester.iso
          key: test-xbe-${{ hashFiles('test-xbe/**') }}

      - name: Build Test Data
        run: bash ./scripts/build_test_data.sh

      - name: Upload Test Data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-data
          path: xemutest/data
          retention-days: 1

      - name: Resolve Roswell BIOS Version
        id: roswell-version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ inputs.roswell_version }}"
          if [ -z "$tag" ] || [ "$tag" = "latest" ]; then
            tag=$(gh release view --repo mborgerson/roswell --json tagName -q .tagName)
          fi
          echo "tag=$tag" >> $GITHUB_OUTPUT

      - name: Cache Roswell BIOS
        id: cache-roswell
        uses: actions/cache@v6
        with:
          path: assets/roswell.bin
          key: roswell-bios-${{ steps.roswell-version.outputs.tag }}

      - name: Download Roswell BIOS Release
        if: steps.cache-roswell.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          gh release download "${{ steps.roswell-version.outputs.tag }}" \
            --repo mborgerson/roswell \
            --pattern "*flash.bin" \
            --output assets/roswell.bin

      - name: Upload Roswell BIOS
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: roswell-bios
          path: assets/roswell.bin
          retention-days: 1

  test-roswell:
    name: Test (${{ matrix.os }})
    needs: prepare-data
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - name: Download Test Data
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: test-data
          path: xemutest/data

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install xemu-pgraph-ci-tools
        run: |
          pip install git+https://github.com/abaire/xemu-pgraph-ci-tools.git

      - name: Download Official xemu Release
        shell: bash
        env:
          XEMU_TAG: ${{ inputs.xemu_version || 'latest' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          python3 -c "
          import os, sys
          from xemu_pgraph_ci_tools.github import download_xemu

          tag = os.environ.get('XEMU_TAG', 'latest') or 'latest'
          xemu_path = download_xemu('assets', tag)
          if not xemu_path or not os.path.exists(xemu_path):
              sys.exit(f'Failed to download official xemu release (tag: {tag})')

          target_path = 'assets/xemu.exe' if sys.platform == 'win32' else ('assets/xemu.app' if sys.platform == 'darwin' else 'assets/xemu')
          if xemu_path != target_path and os.path.exists(xemu_path):
              os.rename(xemu_path, target_path)

          if sys.platform != 'win32':
              bin_path = os.path.join(target_path, 'Contents', 'MacOS', 'xemu') if sys.platform == 'darwin' else target_path
              if os.path.exists(bin_path):
                  os.chmod(bin_path, os.stat(bin_path).st_mode | 0o111)

          print(f'Successfully prepared xemu binary at {target_path}')
          "

      - name: Download Roswell BIOS
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: roswell-bios
          path: assets

      - name: Configure Local Filesystem (Private Directory)
        shell: bash
        run: |
          mkdir -p private
          cp assets/roswell.bin private/bios.bin

      - name: Setup ffmpeg
        id: setup-ffmpeg
        if: runner.os == 'Linux' || (runner.os == 'Windows' && inputs.install_windows_ffmpeg == true)
        uses: FedericoCarboni/setup-ffmpeg@v3.1

      - name: Setup Linux Display & Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qy
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1-mesa-dri libgl1 libglx-mesa0 libegl1 libosmesa6 \
            libsdl2-2.0-0 libepoxy0 libpixman-1-0 libslirp0 libsamplerate0 \
            libpipewire-0.3-0 libpcap0.8 libfuse2t64

      - name: Setup Windows Display & Dependencies (Mesa)
        if: runner.os == 'Windows'
        uses: f3d-app/install-mesa-windows-action@v3
        with:
          path: ${{ github.workspace }}/assets

      - name: Setup venv & Install xemutest
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          activate-environment: true
          python-version: "3.12"

      - name: Install Local xemutest Package
        run: |
          uv pip install .

      - name: Run Tests (Linux)
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_LOADER_DRIVER_OVERRIDE: "llvmpipe"
          SDL_AUDIODRIVER: "dummy"
        run: |
          mkdir -p results
          xvfb-run -s "-screen 0 640x480x24" \
              python -m xemutest \
                  --no-mcpx \
                  --sysram 128 \
                  --ffmpeg "${{ steps.setup-ffmpeg.outputs.ffmpeg-path }}/ffmpeg" \
                  -v \
                  assets/xemu \
                  private \
                  results

      - name: Run Tests (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path results
          $args = @(
              "-m", "xemutest",
              "--no-mcpx",
              "--sysram", "128"
          )
          $ffmpegPath = "${{ steps.setup-ffmpeg.outputs.ffmpeg-path }}"
          if ($ffmpegPath) {
              $args += @("--ffmpeg", "$ffmpegPath/ffmpeg.exe")
          }
          $args += @(
              "-v",
              "assets/xemu.exe",
              "private",
              "results"
          )
          python @args

      - name: Run Tests (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p results
          python -m xemutest \
              --no-mcpx \
              --sysram 128 \
              -v \
              assets/xemu.app/Contents/MacOS/xemu \
              private \
              results

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: '!cancelled()'
        with:
          name: results-${{ matrix.os }}
          path: results