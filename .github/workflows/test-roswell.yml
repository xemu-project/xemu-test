name: Test Roswell

on:
  workflow_dispatch:
    inputs:
      xemu_version:
        description: "xemu release version tag (e.g. 'latest', 'v0.8.30')"
        required: false
        default: "latest"
        type: string
      roswell_version:
        description: "Roswell release version tag (e.g. 'latest', 'v0.1.0')"
        required: false
        default: "latest"
        type: string
      install_windows_ffmpeg:
        description: "Install ffmpeg on Windows runner (slow)"
        required: false
        default: false
        type: boolean
  # Allows other repositories (e.g., xemu) to run these tests against build
  # artifacts produced earlier in the same workflow run. Results are reported
  # as checks on the caller's run (and thus its PRs).
  workflow_call:
    inputs:
      xemu_build_configuration:
        description: "Configuration of the xemu build artifacts in the calling run to test (e.g. 'release', 'debug')"
        required: false
        default: "release"
        type: string
      xemu_test_repository:
        description: "Repository containing the xemu-test sources"
        required: false
        default: "xemu-project/xemu-test"
        type: string
      xemu_test_ref:
        description: "Git ref of xemu_test_repository to test with"
        required: false
        default: "master"
        type: string
      roswell_version:
        description: "Roswell release version tag (e.g. 'latest', 'v0.1.0')"
        required: false
        default: "latest"
        type: string
      install_windows_ffmpeg:
        description: "Install ffmpeg on Windows runner (slow)"
        required: false
        default: false
        type: boolean
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: test-roswell-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-data:
    name: Prepare Test Data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.xemu_test_repository || github.repository }}
          ref: ${{ inputs.xemu_test_ref || '' }}
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache Test Data
        id: cache-test-data
        uses: actions/cache@v6
        with:
          path: xemutest/data
          key: test-data-${{ hashFiles('test-xbe/**', 'scripts/fetch_test_requirements.py') }}

      - name: Build Test Data
        run: bash ./scripts/build_test_data.sh

      - name: Upload Test Data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-data
          path: xemutest/data
          retention-days: 1

      - name: Resolve Roswell BIOS Version
        id: roswell-version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ inputs.roswell_version }}"
          if [ -z "$tag" ] || [ "$tag" = "latest" ]; then
            tag=$(gh release view --repo mborgerson/roswell --json tagName -q .tagName)
          fi
          echo "tag=$tag" >> $GITHUB_OUTPUT

      - name: Cache Roswell BIOS
        id: cache-roswell
        uses: actions/cache@v6
        with:
          path: assets/roswell.bin
          key: roswell-bios-${{ steps.roswell-version.outputs.tag }}

      - name: Download Roswell BIOS Release
        if: steps.cache-roswell.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          gh release download "${{ steps.roswell-version.outputs.tag }}" \
            --repo mborgerson/roswell \
            --pattern "*flash.bin" \
            --output assets/roswell.bin

      - name: Upload Roswell BIOS
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: roswell-bios
          path: assets/roswell.bin
          retention-days: 1

  test-roswell:
    name: Test (${{ matrix.os }})
    needs: prepare-data
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.xemu_test_repository || github.repository }}
          ref: ${{ inputs.xemu_test_ref || '' }}
          submodules: recursive

      - name: Download Test Data
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          name: test-data
          path: xemutest/data

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install xemu-pgraph-ci-tools
        run: |
          pip install git+https://github.com/abaire/xemu-pgraph-ci-tools.git

      - name: Download Official xemu Release
        if: ${{ !inputs.xemu_build_configuration }}
        shell: bash
        env:
          XEMU_TAG: ${{ inputs.xemu_version || 'latest' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          python3 -c "
          import os, sys
          from xemu_pgraph_ci_tools.github import download_xemu

          tag = os.environ.get('XEMU_TAG', 'latest') or 'latest'
          xemu_path = download_xemu('assets', tag)
          if not xemu_path or not os.path.exists(xemu_path):
              sys.exit(f'Failed to download official xemu release (tag: {tag})')

          target_path = 'assets/xemu.exe' if sys.platform == 'win32' else ('assets/xemu.app' if sys.platform == 'darwin' else 'assets/xemu')
          if xemu_path != target_path and os.path.exists(xemu_path):
              os.rename(xemu_path, target_path)

          if sys.platform != 'win32':
              bin_path = os.path.join(target_path, 'Contents', 'MacOS', 'xemu') if sys.platform == 'darwin' else target_path
              if os.path.exists(bin_path):
                  os.chmod(bin_path, os.stat(bin_path).st_mode | 0o111)

          print(f'Successfully prepared xemu binary at {target_path}')
          "

      - name: Download xemu Build Artifact
        if: ${{ inputs.xemu_build_configuration }}
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          name: ${{ runner.os == 'Linux' && 'xemu-ubuntu-x86_64' || runner.os == 'Windows' && 'xemu-windows-x86_64' || 'xemu-macos-universal' }}-${{ inputs.xemu_build_configuration }}
          path: xemu-build

      - name: Prepare xemu Build Artifact
        if: ${{ inputs.xemu_build_configuration }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p assets
          case "$RUNNER_OS" in
            Linux)
              appimages=(xemu-build/xemu-*.AppImage)
              if [ ${#appimages[@]} -ne 1 ]; then
                echo "Expected exactly one AppImage, found: ${appimages[*]}"
                exit 1
              fi
              mv "${appimages[0]}" assets/xemu
              chmod +x assets/xemu
              ;;
            Windows)
              cp -r xemu-build/. assets/
              ;;
            macOS)
              unzip -q xemu-build/xemu-*.zip -d xemu-build/unpacked
              mv xemu-build/unpacked/xemu.app assets/xemu.app
              chmod +x assets/xemu.app/Contents/MacOS/xemu
              ;;
          esac
          rm -rf xemu-build

      - name: Download Roswell BIOS
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          name: roswell-bios
          path: assets

      - name: Configure Local Filesystem (Private Directory)
        shell: bash
        run: |
          mkdir -p private
          cp assets/roswell.bin private/bios.bin

      - name: Configure Crash Dumps (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p "${{ github.workspace }}/crash_dumps"
          chmod 777 "${{ github.workspace }}/crash_dumps"
          sudo sysctl -w "kernel.core_pattern=${{ github.workspace }}/crash_dumps/core.%e.%p.%t"
          sudo sysctl -w fs.suid_dumpable=2

      - name: Configure Crash Dumps (Windows WER)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dumpDir = "${{ github.workspace }}\crash_dumps"
          New-Item -ItemType Directory -Force -Path $dumpDir | Out-Null
          $regPath = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\xemu.exe"
          New-Item -Path $regPath -Force | Out-Null
          New-ItemProperty -Path $regPath -Name "DumpFolder" -Value $dumpDir -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $regPath -Name "DumpCount" -Value 10 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $regPath -Name "DumpType" -Value 2 -PropertyType DWord -Force | Out-Null

      - name: Configure Crash Dumps (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "${{ github.workspace }}/crash_dumps"
          sudo sysctl -w kern.coredump=1 || true
          sudo mkdir -p /cores
          sudo chmod 1777 /cores

      - name: Setup ffmpeg (Windows)
        id: setup-ffmpeg
        if: runner.os == 'Windows' && inputs.install_windows_ffmpeg == true
        uses: FedericoCarboni/setup-ffmpeg@v3.1

      - name: Setup Linux Display & Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qy
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1-mesa-dri libgl1 libglx-mesa0 libegl1 libosmesa6 \
            libsdl2-2.0-0 libepoxy0 libpixman-1-0 libslirp0 libsamplerate0 \
            libpipewire-0.3-0 libpcap0.8 libfuse2t64 gdb ffmpeg

      - name: Setup Windows Display & Dependencies (Mesa)
        if: runner.os == 'Windows'
        uses: f3d-app/install-mesa-windows-action@v3
        with:
          path: ${{ github.workspace }}/assets

      - name: Setup venv & Install xemutest
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          activate-environment: true
          python-version: "3.12"

      - name: Install Local xemutest Package
        run: |
          uv pip install .

      - name: Run Tests (Linux)
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_LOADER_DRIVER_OVERRIDE: "llvmpipe"
          SDL_AUDIODRIVER: "dummy"
        run: |
          ulimit -c unlimited
          mkdir -p results
          xvfb-run -s "-screen 0 640x480x24" \
              python -m xemutest \
                  --no-mcpx \
                  --sysram 128 \
                  --ffmpeg /usr/bin/ffmpeg \
                  --ci-summary-omit-innermost-passed-subtests \
                  -v \
                  --no-hard-fpu \
                  --failure-filter failure_filters/linux_roswell_softfpu.json \
                  assets/xemu \
                  private \
                  results

      - name: Run Tests (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path results
          $args = @(
              "-m", "xemutest",
              "--no-mcpx",
              "--sysram", "128",
              "--no-hard-fpu",
              "--failure-filter", "failure_filters/windows_roswell_softfpu.json",
              "--ci-summary-omit-innermost-passed-subtests"
          )
          $ffmpegPath = "${{ steps.setup-ffmpeg.outputs.ffmpeg-path }}"
          if ($ffmpegPath) {
              $args += @("--ffmpeg", "$ffmpegPath/ffmpeg.exe")
          }
          $args += @(
              "-v",
              "assets/xemu.exe",
              "private",
              "results"
          )
          python @args

      - name: Run Tests (macOS)
        if: runner.os == 'macOS'
        run: |
          ulimit -c unlimited
          mkdir -p results
          python -m xemutest \
              --no-mcpx \
              --sysram 128 \
              --ci-summary-omit-innermost-passed-subtests \
              -v \
              --failure-filter failure_filters/macos_roswell.json \
              assets/xemu.app/Contents/MacOS/xemu \
              private \
              results

      - name: Collect & Inspect Crash Dumps (Linux)
        if: always() && runner.os == 'Linux'
        run: |
          shopt -s nullglob
          cores=("${{ github.workspace }}"/crash_dumps/core.*)
          if [ ${#cores[@]} -gt 0 ]; then
            echo "Found ${#cores[@]} core dump(s). Extracting AppImage binary for symbol/address matching..."
            ./assets/xemu --appimage-extract >/dev/null 2>&1 || true
            inner_bin="squashfs-root/usr/bin/xemu"
            if [ ! -f "$inner_bin" ]; then
              inner_bin=$(find squashfs-root -type f -name "xemu*" -executable | head -n 1)
            fi
            if [ -n "$inner_bin" ] && [ -f "$inner_bin" ]; then
              cp "$inner_bin" "${{ github.workspace }}/crash_dumps/xemu-extracted"
              for core in "${cores[@]}"; do
                echo "=== Backtrace for $core ==="
                gdb -batch \
                  -ex "info registers" \
                  -ex "x/10i \$pc-16" \
                  -ex "thread apply all bt" \
                  "$inner_bin" "$core" || true
              done
            fi
            rm -rf squashfs-root
          fi

      - name: Collect Crash Dumps (macOS)
        if: always() && runner.os == 'macOS'
        run: |
          shopt -s nullglob
          for f in /cores/core.* "$HOME/Library/Logs/DiagnosticReports"/xemu* /Library/Logs/DiagnosticReports/xemu*; do
            if [ -f "$f" ]; then
              cp "$f" "${{ github.workspace }}/crash_dumps/" || true
            fi
          done

      - name: Upload Crash Dumps
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: crash-dumps-${{ matrix.os }}
          path: crash_dumps
          if-no-files-found: ignore
          retention-days: 5

      - name: Upload results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: '!cancelled()'
        with:
          name: results-${{ matrix.os }}
          path: results