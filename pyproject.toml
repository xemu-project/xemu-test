[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xemutest"
version = "0.0.8"
description = "xemu Automated Tests"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Matt Borgerson", email = "contact@mborgerson.com"}
]

dependencies = [
    "pyfatx >= 0.0.8",
    "pywinauto == 0.6.9; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/xemu-project/xemu-test"

[tool.setuptools.packages.find]
include = ["xemutest*"]

[tool.setuptools.package-data]
xemutest = ["data/**/*"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# This is a test harness; asserts are expected.
extend-ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# ci.py prints GitHub Actions workflow commands to stdout.
"xemutest/ci.py" = ["T201"]
# Test modules are loaded by file name, not as a package.
"xemutest/tests/**" = ["INP001"]
